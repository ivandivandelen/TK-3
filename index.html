<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D0D0D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fly Send</title>
  <style>
    :root {
      --bg-dark: #0D0D0D;
      --bg-panel: #161616;
      --bg-card: #1F1F1F;
      --yellow: #FFD600;
      --yellow-hover: #FFE033;
      --text-main: #F5F5F5;
      --text-muted: #9E9E9E;
      --border: #2C2C2C;
      --green: #00E676;
      --red: #FF5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* GİRİŞ EKRANI */
    #login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      background: var(--yellow);
      color: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 16px;
      box-shadow: 0 0 30px rgba(255, 214, 0, 0.25);
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--yellow);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
      text-align: center;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--yellow);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group input:focus {
      border-color: var(--yellow);
    }

    .btn-primary {
      background: var(--yellow);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: transform 0.1s, background 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* ANA SOHBET EKRANI */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-dark);
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mini-logo {
      width: 36px;
      height: 36px;
      background: var(--yellow);
      color: #000;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
    }

    .header-info h1 {
      font-size: 17px;
      font-weight: 800;
      color: var(--yellow);
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .status-dot.ghost {
      background: #757575;
      box-shadow: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-btn.ghost-active {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(255, 214, 0, 0.1);
    }

    /* ÇEVRİMİÇİ KULLANICILAR ŞERİDİ */
    #online-bar {
      background: #121212;
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .online-pill {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .online-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    /* MESAJ ALANI */
    #messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.theirs {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11px;
      font-weight: 700;
      color: var(--yellow);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .msg-row.mine .msg-sender {
      color: var(--text-muted);
    }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .msg-row.mine .msg-bubble {
      background: var(--yellow);
      color: #000;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .msg-row.theirs .msg-bubble {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-image {
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      display: block;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .msg-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
      text-align: right;
    }

    /* ALT MESAJ YAZMA BARI */
    .input-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .photo-label {
      width: 44px;
      height: 44px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--yellow);
      cursor: pointer;
      flex-shrink: 0;
    }

    .photo-label input {
      display: none;
    }

    #msg-input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    #msg-input:focus {
      border-color: var(--yellow);
    }

    #send-btn {
      width: 44px;
      height: 44px;
      background: var(--yellow);
      color: #000;
      border: none;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-weight: bold;
    }

    /* AYARLAR MODALI */
    #settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 18px;
      color: var(--yellow);
    }

    .close-modal {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
    }

    .btn-danger {
      background: rgba(255, 82, 82, 0.15);
      color: var(--red);
      border: 1px solid var(--red);
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* TAM EKRAN RESİM GÖRÜNTÜLEYİCİ */
    #image-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 16px;
    }

    #image-viewer img {
      max-width: 100%;
      max-height: 90dvh;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- İLK GİRİŞ EKRANI -->
  <div id="login-screen">
    <div class="brand-logo">⚡</div>
    <div class="brand-title">FLY SEND</div>
    <div class="brand-sub">Sarı-Siyah Özel Bulut Haberleşme Ağı</div>

    <div class="login-box">
      <div class="input-group">
        <label>Kullanıcı Adın (Tek Seferlik)</label>
        <input type="text" id="setup-username" placeholder="Örn: Kaptan" maxlength="20" />
      </div>
      <div class="input-group">
        <label>Ortak Oda Kodu</label>
        <input type="text" id="setup-room" placeholder="Örn: yolgecenhani" value="yolgecenhani" maxlength="24" />
      </div>
      <button class="btn-primary" id="start-btn">Sohbete Bağlan</button>
    </div>
  </div>

  <!-- ANA SOHBET EKRANI -->
  <div id="chat-screen">
    <header>
      <div class="header-left">
        <div class="mini-logo">⚡</div>
        <div class="header-info">
          <h1>Fly Send</h1>
          <div class="status-line">
            <span class="status-dot" id="my-status-dot"></span>
            <span id="my-status-text">Çevrimiçi</span>
            <span>•</span>
            <span id="room-badge" style="color:#FFD600;font-weight:600;"></span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="ghost-btn" title="Hayalet Modu">
          👁️ <span id="ghost-label">Görünür</span>
        </button>
        <button class="icon-btn" id="open-settings-btn" title="Ayarlar">⚙️</button>
      </div>
    </header>

    <div id="online-bar">
      <span style="color:#FFD600;font-weight:700;">Aktif:</span>
      <span id="online-users-list">Bağlanıyor...</span>
    </div>

    <div id="messages-container"></div>

    <div class="input-bar">
      <label class="photo-label" title="Fotoğraf Gönder">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <input type="file" id="photo-input" accept="image/*" />
      </label>

      <input type="text" id="msg-input" placeholder="Mesaj yaz..." autocomplete="off" />

      <button id="send-btn" title="Gönder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- AYARLAR & ÇIKARMA MODU MODALI -->
  <div id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Ayarlar</h2>
        <button class="close-modal" id="close-settings-btn">&times;</button>
      </div>

      <div class="input-group">
        <label>Kullanıcı Adını Değiştir</label>
        <input type="text" id="edit-username" maxlength="20" />
      </div>

      <div class="input-group">
        <label>Oda Kodunu Değiştir</label>
        <input type="text" id="edit-room" maxlength="24" />
      </div>

      <button class="btn-primary" id="save-settings-btn">Değişiklikleri Kaydet</button>
      <button class="btn-danger" id="eject-btn">🚪 Çıkarma Modu (Hesabı Sıfırla)</button>
    </div>
  </div>

  <!-- RESİM BÜYÜTME EKRANI -->
  <div id="image-viewer" onclick="this.style.display='none'">
    <img id="viewer-img" src="" alt="Önizleme" />
  </div>

  <!-- FIREBASE SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, onSnapshot, query, where,
      doc, setDoc, deleteDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // SENİN FIREBASE PROJE BİLGİLERİN (TK 3)
    const firebaseConfig = {
      apiKey: "AIzaSyBKuMzcGOqvE1raFan4F9lJE-L-MCb75O0",
      authDomain: "tk-3-b2636.firebaseapp.com",
      projectId: "tk-3-b2636",
      storageBucket: "tk-3-b2636.firebasestorage.app",
      messagingSenderId: "455550542644",
      appId: "1:455550542644:web:12a478a81636e0f65a7b61"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // KULLANICI DURUMU
    let userId = localStorage.getItem("flysend_uid");
    if (!userId) {
      userId = "u_" + Math.random().toString(36).substring(2, 11);
      localStorage.setItem("flysend_uid", userId);
    }

    let username = localStorage.getItem("flysend_username") || "";
    let roomCode = localStorage.getItem("flysend_room") || "yolgecenhani";
    let isGhost = localStorage.getItem("flysend_ghost") === "true";

    let unsubMessages = null;
    let unsubPresence = null;
    let heartbeatTimer = null;

    // ELEMENTLER
    const loginScreen = document.getElementById("login-screen");
    const chatScreen = document.getElementById("chat-screen");
    const setupUsername = document.getElementById("setup-username");
    const setupRoom = document.getElementById("setup-room");
    const startBtn = document.getElementById("start-btn");

    const ghostBtn = document.getElementById("ghost-btn");
    const ghostLabel = document.getElementById("ghost-label");
    const myStatusDot = document.getElementById("my-status-dot");
    const myStatusText = document.getElementById("my-status-text");
    const roomBadge = document.getElementById("room-badge");
    const onlineUsersList = document.getElementById("online-users-list");
    const messagesContainer = document.getElementById("messages-container");

    const msgInput = document.getElementById("msg-input");
    const sendBtn = document.getElementById("send-btn");
    const photoInput = document.getElementById("photo-input");

    const settingsModal = document.getElementById("settings-modal");
    const openSettingsBtn = document.getElementById("open-settings-btn");
    const closeSettingsBtn = document.getElementById("close-settings-btn");
    const editUsername = document.getElementById("edit-username");
    const editRoom = document.getElementById("edit-room");
    const saveSettingsBtn = document.getElementById("save-settings-btn");
    const ejectBtn = document.getElementById("eject-btn");

    // BAŞLANGIÇ KONTROLÜ
    if (username) {
      enterChat();
    }

    startBtn.addEventListener("click", () => {
      const nameVal = setupUsername.value.trim();
      const roomVal = setupRoom.value.trim().toLowerCase() || "genel";
      if (!nameVal) {
        alert("Lütfen bir kullanıcı adı gir.");
        return;
      }
      username = nameVal;
      roomCode = roomVal;
      localStorage.setItem("flysend_username", username);
      localStorage.setItem("flysend_room", roomCode);
      enterChat();
    });

    function enterChat() {
      loginScreen.style.display = "none";
      chatScreen.style.display = "flex";
      roomBadge.textContent = "#" + roomCode;
      updateGhostUI();
      startListeners();
    }

    // GİZLENME (HAYALET) MODU
    function updateGhostUI() {
      if (isGhost) {
        ghostBtn.classList.add("ghost-active");
        ghostLabel.textContent = "Gizli";
        myStatusDot.classList.add("ghost");
        myStatusText.textContent = "Gizli Mod";
      } else {
        ghostBtn.classList.remove("ghost-active");
        ghostLabel.textContent = "Görünür";
        myStatusDot.classList.remove("ghost");
        myStatusText.textContent = "Çevrimiçi";
      }
    }

    ghostBtn.addEventListener("click", async () => {
      isGhost = !isGhost;
      localStorage.setItem("flysend_ghost", isGhost);
      updateGhostUI();
      await updatePresence();
    });

    // ÇEVRİMİÇİ DURUM GÜNCELLEME
    async function updatePresence() {
      const presenceRef = doc(db, "flysend_presence", `${roomCode}_${userId}`);
      if (isGhost) {
        try { await deleteDoc(presenceRef); } catch (e) {}
      } else {
        try {
          await setDoc(presenceRef, {
            uid: userId,
            name: username,
            room: roomCode,
            lastSeen: Date.now()
          });
        } catch (e) {
          console.error("Durum hatası:", e);
        }
      }
    }

    function startListeners() {
      if (unsubMessages) unsubMessages();
      if (unsubPresence) unsubPresence();
      if (heartbeatTimer) clearInterval(heartbeatTimer);

      updatePresence();
      heartbeatTimer = setInterval(updatePresence, 25000);

      // Çevrimiçi kullanıcıları dinle
      const qPresence = query(
        collection(db, "flysend_presence"),
        where("room", "==", roomCode)
      );
      unsubPresence = onSnapshot(qPresence, (snap) => {
        const now = Date.now();
        const activeNames = [];
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          if (now - data.lastSeen < 65000) {
            activeNames.push(data.name);
          }
        });
        if (activeNames.length === 0) {
          onlineUsersList.innerHTML = `<span style="color:#757575;">Kimse görünmüyor</span>`;
        } else {
          onlineUsersList.innerHTML = activeNames
            .map((n) => `<span class="online-pill">${escapeHtml(n)}</span>`)
            .join("");
        }
      });

      // Mesajları dinle
      const qMessages = query(
        collection(db, "flysend_messages"),
        where("room", "==", roomCode)
      );
      unsubMessages = onSnapshot(qMessages, (snap) => {
        const msgs = [];
        snap.forEach((d) => msgs.push({ id: d.id, ...d.data() }));
        msgs.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
        renderMessages(msgs);
      });
    }

    function renderMessages(msgs) {
      messagesContainer.innerHTML = "";
      msgs.forEach((m) => {
        const isMine = m.uid === userId;
        const row = document.createElement("div");
        row.className = "msg-row " + (isMine ? "mine" : "theirs");

        const timeStr = m.createdAt
          ? new Date(m.createdAt).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" })
          : "";

        let contentHtml = "";
        if (m.image) {
          contentHtml += `<img src="${m.image}" class="msg-image" onclick="openViewer('${m.image}')" />`;
        }
        if (m.text) {
          contentHtml += `<div>${escapeHtml(m.text)}</div>`;
        }

        row.innerHTML = `
          <div class="msg-sender">${escapeHtml(m.sender || "Anonim")}</div>
          <div class="msg-bubble">
            ${contentHtml}
            <div class="msg-time">${timeStr}</div>
          </div>
        `;
        messagesContainer.appendChild(row);
      });
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    window.openViewer = function (src) {
      document.getElementById("viewer-img").src = src;
      document.getElementById("image-viewer").style.display = "flex";
    };

    // METİN MESAJI GÖNDERME
    async function sendTextMessage() {
      const text = msgInput.value.trim();
      if (!text) return;
      msgInput.value = "";
      try {
        await addDoc(collection(db, "flysend_messages"), {
          room: roomCode,
          uid: userId,
          sender: username,
          text: text,
          image: null,
          createdAt: Date.now()
        });
      } catch (err) {
        alert("Mesaj gönderilemedi! Firebase Firestore kurallarını kontrol et: " + err.message);
      }
    }

    sendBtn.addEventListener("click", sendTextMessage);
    msgInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendTextMessage();
    });

    // FOTOĞRAF SEÇME VE OTOMATİK SIKIŞTIRIP GÖNDERME
    photoInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = async () => {
          const canvas = document.createElement("canvas");
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL("image/jpeg", 0.72);
          try {
            await addDoc(collection(db, "flysend_messages"), {
              room: roomCode,
              uid: userId,
              sender: username,
              text: "",
              image: compressedBase64,
              createdAt: Date.now()
            });
          } catch (err) {
            alert("Fotoğraf gönderilemedi: " + err.message);
          }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
      photoInput.value = "";
    });

    // AYARLAR VE ÇIKARMA MODU
    openSettingsBtn.addEventListener("click", () => {
      editUsername.value = username;
      editRoom.value = roomCode;
      settingsModal.style.display = "flex";
    });

    closeSettingsBtn.addEventListener("click", () => {
      settingsModal.style.display = "none";
    });

    saveSettingsBtn.addEventListener("click", async () => {
      const newName = editUsername.value.trim();
      const newRoom = editRoom.value.trim().toLowerCase() || "genel";
      if (!newName) return;

      try {
        await deleteDoc(doc(db, "flysend_presence", `${roomCode}_${userId}`));
      } catch (e) {}

      username = newName;
      roomCode = newRoom;
      localStorage.setItem("flysend_username", username);
      localStorage.setItem("flysend_room", roomCode);
      roomBadge.textContent = "#" + roomCode;
      settingsModal.style.display = "none";
      startListeners();
    });

    ejectBtn.addEventListener("click", async () => {
      try {
        await deleteDoc(doc(db, "flysend_presence", `${roomCode}_${userId}`));
      } catch (e) {}
      localStorage.removeItem("flysend_username");
      localStorage.removeItem("flysend_room");
      localStorage.removeItem("flysend_ghost");
      location.reload();
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
